<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Go Chat Pro - High Load</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">
    
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-blue-600 text-center">🔐 Vào Phòng Chat</h2>
            
            <div class="space-y-3 mb-6">
                <input id="roomID" type="text" placeholder="Mã số phòng" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <input id="roomPass" type="password" placeholder="Mật khẩu" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <input id="username" type="text" placeholder="Tên của bạn" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="joinRoom()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">VÀO PHÒNG</button>
            </div>

            <div id="historySection" class="hidden border-t pt-4">
                <p class="text-sm font-bold text-gray-500 mb-2 uppercase tracking-wider">Phòng đã tham gia gần đây:</p>
                <div id="roomHistory" class="space-y-2 max-h-40 overflow-y-auto">
                    </div>
            </div>
        </div>
    </div>

    <div id="chatScreen" class="hidden h-screen flex flex-col">
        <div class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="leaveRoom()" class="bg-blue-700 hover:bg-red-500 p-2 rounded-lg transition" title="Thoát phòng">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
                <div>
                    <h1 class="text-lg font-bold">Phòng: <span id="displayRoom"></span></h1>
                    <p class="text-[10px] opacity-80 uppercase font-black" id="displayUser"></p>
                </div>
            </div>
            <div class="bg-blue-800 px-4 py-1 rounded-full text-sm font-bold flex items-center gap-2">
                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                Online: <span id="onlineCount">0</span>
            </div>
        </div>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50"></div>

        <div class="p-4 bg-white border-t flex gap-2 shadow-inner">
            <input id="input" type="text" placeholder="Nhập tin nhắn..." class="flex-1 p-3 border rounded-xl outline-none focus:border-blue-500">
            <button onclick="send()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition uppercase tracking-tighter">Gửi</button>
        </div>
    </div>

    <script>
        let ws;
        let currentUser = "";

        // Tải lịch sử phòng khi mở trang
        window.onload = loadHistory;

        function joinRoom(rid, pass) {
            const roomID = rid || document.getElementById('roomID').value;
            const password = pass || document.getElementById('roomPass').value;
            const user = document.getElementById('username').value || "Ẩn danh";

            if(!roomID || !password) return alert("Vui lòng nhập Mã phòng và Mật khẩu!");
            currentUser = user;

            ws = new WebSocket(`ws://${window.location.host}/ws?roomID=${encodeURIComponent(roomID)}&password=${encodeURIComponent(password)}`);

            ws.onopen = () => {
                // Lưu vào lịch sử
                saveToHistory(roomID, password);
                
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('chatScreen').classList.remove('hidden');
                document.getElementById('displayRoom').innerText = roomID;
                document.getElementById('displayUser').innerText = `User: ${user}`;
                document.getElementById('chatBox').innerHTML = ""; // Xóa tin nhắn cũ
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.type === 'error') {
                    alert(data.content);
                    ws.close();
                } else if(data.type === 'count') {
                    document.getElementById('onlineCount').innerText = data.content;
                } else if(data.type === 'chat') {
                    renderMessage(data);
                }
            };

            ws.onclose = () => {
                document.getElementById('loginModal').classList.remove('hidden');
                document.getElementById('chatScreen').classList.add('hidden');
                loadHistory(); // Cập nhật lại lịch sử khi quay ra
            };
        }

        function renderMessage(data) {
            const div = document.createElement('div');
            const isMe = data.sender === currentUser;
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} animate-fade-in`;
            div.innerHTML = `
                <div class="${isMe ? 'bg-blue-600 text-white shadow-blue-200' : 'bg-white text-gray-800 border-gray-200'} p-3 rounded-2xl shadow-md max-w-[75%] border">
                    <p class="text-[9px] ${isMe ? 'text-blue-200' : 'text-blue-600'} font-black uppercase mb-1">${data.sender}</p>
                    <p class="text-sm font-medium">${data.content}</p>
                </div>
            `;
            const chatBox = document.getElementById('chatBox');
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function send() {
            const input = document.getElementById("input");
            if (input.value.trim() !== "" && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'chat', sender: currentUser, content: input.value }));
                input.value = "";
            }
        }

        function leaveRoom() {
            if(ws) ws.close();
        }

        // Quản lý LocalStorage
        function saveToHistory(id, pass) {
            let history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            // Xóa phòng cũ nếu trùng ID
            history = history.filter(r => r.id !== id);
            // Thêm vào đầu danh sách
            history.unshift({id, pass});
            // Giữ lại tối đa 5 phòng
            localStorage.setItem('chatHistory', JSON.stringify(history.slice(0, 5)));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            const container = document.getElementById('roomHistory');
            const section = document.getElementById('historySection');

            if(history.length > 0) {
                section.classList.remove('hidden');
                container.innerHTML = history.map(room => `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border hover:border-blue-300 transition group cursor-pointer" onclick="fillAndJoin('${room.id}', '${room.pass}')">
                        <span class="font-bold text-gray-700">Room: ${room.id}</span>
                        <span class="text-xs text-blue-500 opacity-0 group-hover:opacity-100 font-bold italic">Bấm để vào nhanh →</span>
                    </div>
                `).join('');
            }
        }

        function fillAndJoin(id, pass) {
            document.getElementById('roomID').value = id;
            document.getElementById('roomPass').value = pass;
            // Nếu đã nhập tên thì tự join luôn
            if(document.getElementById('username').value) joinRoom(id, pass);
        }

        // Lắng nghe phím Enter
        document.getElementById("input").addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
    </script>

    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.2s ease-out forwards; }
    </style>
</body>
</html>
